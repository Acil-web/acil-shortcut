<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNI Mobile - Precision Match</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Menggunakan font Inter yang sangat mirip dengan font sistem mobile BNI */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            --bni-black: #333333;  /* Lebih tebal/gelap untuk sisi kiri */
            --bni-gray: #616161;     /* Abu-abu untuk Sisi Kanan */
            --bni-orange: #E55300;
            --bni-teal: #005E6A;
        }

        body {
            background: #121212;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* AREA STRUK */
        .container {
            position: relative;
            width: 375px;
            background: white;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .background { width: 100%; display: block; }
        
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* HEADER SECTION */
        .st-header {
            position: absolute;
            top: 24px;
            width: 100%;
            text-align: center;
        }

        /* 1. Bacaan INFORMASI (Sesuai Kotak Merah Anda: Hitam & Bold) */
        .st-info-title { 
            font-size: 17px; 
            color: var(--bni-black); 
            font-weight: 500; 
            letter-spacing: -0.2px;
            margin-bottom: 53px; 
        }

        .st-status-msg { 
            font-size: 19px; 
            font-weight: 400; 
            color: #000000; 
            letter-spacing: -0.5px;
        }

        /* BARIS DATA */
        .st-row {
            position: absolute;
            width: 100%;
            padding: 0 32px; /* Margin sisi kiri-kanan lebih presisi */
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            font-size: 13.4px;
        }

        /* 2. SISI KIRI (Sesuai Kotak Merah Anda: Hitam & Bold) */
        .st-label { 
            color: var(--bni-black); 
            font-weight: 400; 
        }

        /* 3. SISI KANAN (Sesuai Kotak Merah Anda: Abu-abu & Tipis) */
        .st-value { 
            color: var(--bni-gray); 
            font-weight: 400;
            text-align: right;
        }

        /* POSISI VERTIKAL (Top Alignment) */
        #row-rek      { top: 154px; }
        #row-penerima { top: 188px; }
        #row-tgl      { top: 222px; }
        #row-jam      { top: 256px; }
        #row-email    { top: 290px; }
        #row-bank     { top: 324px; }
        #row-pengirim { top: 358px; }
        #row-nom      { top: 392px; }
        #row-fee      { top: 426px; }
        #row-total    { top: 460px; }
        #row-ket      { top: 494px; }

        /* PANEL KONTROL */
        #control-panel {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 15px;
            width: 340px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #control-panel input {
            padding: 12px;
            background: #2b2b2b;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn { padding: 12px; border-radius: 25px; border: none; cursor: pointer; font-weight: 600; color: white; }
    </style>
</head>
<body>

    <div id="control-panel">
        <h3 style="color: #00c2a8; margin: 0 0 10px 0; text-align: center;">BNI Editor - Final Version</h3>
        <input type="text" id="in-rek" oninput="update()" placeholder="Rekening Tujuan">
        <input type="text" id="in-nama" oninput="update()" placeholder="Nama Penerima">
        <input type="text" id="in-nom" oninput="fmt(this); update();" placeholder="Nominal">
        <input type="text" id="in-pengirim" oninput="update()" placeholder="Nama Pengirim">
        <input type="text" id="in-dt" oninput="update()" placeholder="Tanggal & Jam">
        
        <button class="btn" style="background: var(--bni-orange)" onclick="gen()">Update Otomatis</button>
        <button class="btn" style="background: var(--bni-teal)" onclick="download()">Download PNG</button>
    </div>

    <div class="container" id="strukBNI">
        <img src="https://i.imgur.com/PAAu9og.jpeg" class="background">
        
        <div class="overlay">
            <div class="st-header">
                <div class="st-info-title">Informasi</div>
                <div class="st-status-msg">Transaksi Berhasil</div>
            </div>

            <div class="st-row" id="row-rek"><div class="st-label">Rekening Tujuan</div><div class="st-value" id="v-rek">1910995890</div></div>
            <div class="st-row" id="row-penerima"><div class="st-label">Nama Penerima</div><div class="st-value" id="v-nama">Ibu ROHMAT</div></div>
            <div class="st-row" id="row-tgl"><div class="st-label">Tanggal Transaksi</div><div class="st-value" id="v-tgl">16-01-2026</div></div>
            <div class="st-row" id="row-jam"><div class="st-label">Waktu Transaksi</div><div class="st-value" id="v-jam">23:23:55 WIB</div></div>
            <div class="st-row" id="row-email"><div class="st-label">Email Penerima</div><div class="st-value"> </div></div>
            <div class="st-row" id="row-bank"><div class="st-label">Bank Tujuan</div><div class="st-value">BNI</div></div>
            <div class="st-row" id="row-pengirim"><div class="st-label">Nama Pengirim</div><div class="st-value" id="v-pengirim">M. SULAEMAN</div></div>
            <div class="st-row" id="row-nom"><div class="st-label">Nominal</div><div class="st-value" id="v-nom">Rp50.000</div></div>
            <div class="st-row" id="row-fee"><div class="st-label">Fee</div><div class="st-value">Rp0</div></div>
            <div class="st-row" id="row-total"><div class="st-label">Total</div><div class="st-value" id="v-total">Rp50.000</div></div>
            <div class="st-row" id="row-ket"><div class="st-label">Keterangan</div><div class="st-value">-</div></div>
        </div>
    </div>

    <script>
        function fmt(el) {
            let v = el.value.replace(/\D/g, '');
            if (v !== "") el.value = parseInt(v).toLocaleString('id-ID');
        }

        function update() {
            const get = (id) => document.getElementById(id).value;
            if(get('in-rek')) document.getElementById('v-rek').innerText = get('in-rek');
            if(get('in-nama')) document.getElementById('v-nama').innerText = get('in-nama');
            if(get('in-pengirim')) document.getElementById('v-pengirim').innerText = get('in-pengirim');
            if(get('in-nom')) {
                document.getElementById('v-nom').innerText = "Rp" + get('in-nom');
                document.getElementById('v-total').innerText = "Rp" + get('in-nom');
            }

            const dt = get('in-dt').split(' ');
            if (dt[0]) document.getElementById('v-tgl').innerText = dt[0];
            if (dt[1]) document.getElementById('v-jam').innerText = dt[1] + " WIB";
        }

        function gen() {
            const n = new Date();
            const t = n.toLocaleDateString('id-ID', {day:'2-digit', month:'2-digit', year:'numeric'}).replace(/\//g, '-');
            const j = n.toLocaleTimeString('id-ID', {hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'});
            document.getElementById('in-dt').value = `${t} ${j}`;
            update();
        }

        async function download() {
            const canvas = await html2canvas(document.getElementById("strukBNI"), { 
                scale: 3,
                useCORS: true,
                logging: false
            });
            const link = document.createElement("a");
            link.download = `BNI_Struk_Precision.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        }

        window.onload = gen;
    </script>
</body>
</html>
